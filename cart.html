<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購物車｜日宣繪畫室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;600;700&family=Poppins:wght@700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="ambient-grain" aria-hidden="true"></div>

  <header class="site-header">
    <!-- 結帳流程會整頁導去綠界電子地圖選門市再導回這頁，history 裡會夾著
         那個外部頁面；固定回材料包母頁，不用瀏覽器上一頁（見
         js/site-header-scroll.js data-back-fixed 的說明）。 -->
    <a class="site-header__back" href="products/index.html" data-back-fixed>← 返回</a>
    <div class="site-header__title">購物車</div>
    <!-- 填收件資料往下滑、上面那條「確認訂單詳情」橫條捲出畫面之後，橫條
         會併進這一列頂部導覽（.site-header.is-order-docked）：標題位置換成
         這顆可點開訂單明細的按鈕，購物車圖示位置換成金額，讓客人不管滑到
         哪裡都看得到目前訂單多少錢、也隨時點得開明細。見 js/checkout.js
         initOrderDock()。 -->
    <button type="button" class="site-header__order" hidden aria-expanded="false">
      <span>確認訂單詳情</span>
      <svg class="site-header__order-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="cart-badge-wrap">
      <button type="button" class="cart-badge" aria-haspopup="true" aria-expanded="false" aria-label="購物車，目前 0 件">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-badge__count">0</span>
      </button>
      <div class="cart-preview" hidden>
        <ul class="cart-preview__list"></ul>
        <p class="cart-preview__empty">購物車是空的</p>
        <p class="cart-preview__total"></p>
        <div class="cart-preview__actions">
          <a class="cart-preview__view" href="cart.html">查看購物車</a>
          <button type="button" class="cart-preview__continue">繼續選購</button>
        </div>
      </div>
    </div>
    <span class="site-header__order-total" hidden></span>
  </header>

  <nav class="pill-nav" aria-label="全站分類導覽">
    <a href="index.html" data-cat="group">團體課</a>
    <a href="products/index.html" data-cat="materials" aria-current="page">材料包</a>
    <a href="index.html" data-cat="courses">課程</a>
  </nav>

  <main class="product-page cart-page work">

    <header class="work__intro">
      <h1 class="work-heading fade-in"><span class="inner">您的購物車</span></h1>
    </header>

    <!-- 購物車編輯畫面。按「結帳」之後，這一整塊會被藏起來，改顯示下面那條
         「確認訂單詳情＋金額」的橫條，以及 #order-confirm-view 那塊（同一頁
         往下展開，不再跳轉到另一個頁面）。如果網址上已經帶著 orderId
         （例如從綠界電子地圖選店回來），一開始就直接藏起這塊，見
         js/checkout.js。

         結帳確認區塊（#order-confirm-view）不套用捲動淡入——那是逐步展開
         的表單流程，切換步驟當下就該立即顯示，不需要跟敘事類頁面一樣
         等捲動淡入。 -->
    <div id="cart-edit-view">
      <section class="chapter fade-in delay-1">
        <div class="cart-columns" hidden>
          <span>商品</span>
          <span>小計</span>
        </div>
        <div class="cart-groups"></div>
        <p class="cart-empty" hidden>購物車目前是空的，<a class="text-link" href="products/fluid-art-intro.html">看看材料包</a>。</p>
      </section>

      <section class="chapter cart-discount fade-in delay-2">
        <div class="cart-discount__control">
          <input type="text" class="cart-discount__input" placeholder="折扣碼" aria-label="折扣碼">
          <button type="button" class="cart-discount__apply">套用</button>
        </div>
      </section>

      <footer class="work__close fade-in delay-3">
        <div class="work__close-text">
          <p class="work__shipping-note">運費和折扣將在結帳時計算。</p>
          <p class="checkout-error" role="alert" hidden></p>
          <p class="work__price">小計 $0</p>
        </div>
        <button type="button" class="work__cta work__cta--primary" data-checkout-cta disabled>結帳</button>
      </footer>
    </div>

    <!-- 結帳後取代購物車編輯區的橫條：左邊「確認訂單詳情」、右邊金額。
         點一下從畫面下方滑出訂單明細（.order-sheet），不是就地展開——
         就地展開會把下面正在填的表單整個推走，關掉之後還要再滑回來，
         用彈出面板才能關掉就回到原本填到一半的位置。往下滑時這條會併進
         頂部導覽，見 js/checkout.js initOrderDock()。 -->
    <button type="button" class="cart-collapse" hidden aria-haspopup="dialog" aria-expanded="false">
      <span class="cart-collapse__label">確認訂單詳情</span>
      <span class="cart-collapse__total"></span>
      <svg class="cart-collapse__chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <!-- 結帳確認區塊：選送貨方式、填收件資訊，最後送出到綠界付款頁。
         內容跟欄位配置沿用原本 checkout-confirm.html 的設計，只是現在跟
         購物車在同一頁，不用另外跳轉一次。 -->
    <div id="order-confirm-view" hidden>

      <section class="chapter" id="confirm-loading">
        <p class="chapter__intro">正在載入訂單內容…</p>
      </section>

      <section class="chapter" id="confirm-error" hidden>
        <p class="chapter__intro" data-placeholder="true"></p>
        <p class="chapter__intro"><button type="button" class="text-link" id="confirm-back-to-cart">回到購物車重新結帳</button></p>
      </section>

      <div id="confirm-content" class="order-confirm-box" hidden>
        <!-- 這裡原本還有一段收合式的「你選購的商品」清單，但購物車編輯區
             本身結帳後就收合成「確認訂單詳情」橫條、點開就是同一批商品
             （而且還多了縮圖跟可直接調整的數量），兩個收合清單並排等於
             同一件事講兩次，所以移除，只留上面那一條。 -->
        <!-- 聯絡資訊（下單、收款項通知的聯絡窗口，不依賴送貨方式，一開始
             就能填）、送貨方式、收件資料（實際收貨的人，禮物代購或公司
             代收等情境可能是別人，且需要知道送貨方式才能決定要問「取貨」
             還是「地址」）依序排成三步；<form> 整個往外拉，同時包住這三個
             <section>，送出按鈕放在最後。 -->
        <form id="confirm-form" method="POST" action="">
          <input type="hidden" name="orderId" id="confirm-order-id">
          <input type="hidden" name="shippingMethod" id="confirm-shipping-method">

          <section class="chapter" id="customer-section">
            <h2 class="chapter__title"><span class="step-badge">1</span>聯絡資訊</h2>
            <!-- 姓名分成名字／姓氏左右並排，送出時用 #confirm-customer-name
                 這個隱藏欄位把兩個值合併成後端原本認得的單一 customerName
                 （見 js/checkout.js syncCustomerName()），不改後端契約。 -->
            <div class="confirm-field-row">
              <label class="confirm-field">
                <span>姓氏</span>
                <div class="confirm-field__control">
                  <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
                  <input type="text" id="customer-last-name" required maxlength="10" autocomplete="family-name" placeholder="姓氏">
                </div>
              </label>
              <label class="confirm-field">
                <span>名字</span>
                <div class="confirm-field__control">
                  <input type="text" id="customer-first-name" required maxlength="10" autocomplete="given-name" placeholder="名字">
                </div>
              </label>
            </div>
            <input type="hidden" name="customerName" id="confirm-customer-name">
            <label class="confirm-field">
              <span>手機（取貨／到貨簡訊會發到這個號碼）</span>
              <div class="confirm-field__control">
                <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5c-1 0-2 .9-2 2 0 7.2 6.3 13.5 13.5 13.5 1.1 0 2-.9 2-2v-2.3l-3.7-1-1.6 1.6a9.5 9.5 0 0 1-5.6-5.6l1.6-1.6-1-3.7H6.5z"/></svg>
                <input type="tel" name="customerPhone" required pattern="09[0-9]{8}" placeholder="09XXXXXXXX" autocomplete="tel">
              </div>
            </label>
            <label class="confirm-field">
              <span>Email（付款成功／出貨通知會寄到這裡）</span>
              <div class="confirm-field__control">
                <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
                <input type="email" name="customerEmail" required autocomplete="email" placeholder="you@example.com">
              </div>
            </label>
            <label class="confirm-checkbox">
              <input type="checkbox" name="marketingOptIn" value="true">
              <span>我想收到最新消息和限定優惠通知</span>
            </label>
          </section>

          <!-- 送貨方式：還沒選的話顯示兩個選項；超商取貨會整頁導去綠界電子地圖，
               選完店綠界會把瀏覽器導回這一頁（帶著 orderId）；宅配到府不用離開
               這頁，直接在下面顯示地址欄位。兩條路最後都在同一個 <form> 送出
               到 create-order。
               送貨方式選擇維持同一組按鈕常駐畫面，不會因為選完就被隱藏、換成
               一行文字連結——選中的那顆用 aria-pressed 標記「已選」樣式即可，
               要改選另一種方式，直接點另一顆按鈕（超商取貨會整頁導去綠界
               電子地圖重新選店；宅配到府純本機切換）。 -->
          <section class="chapter" id="shipping-section">
            <h2 class="chapter__title"><span class="step-badge">2</span>送貨方式</h2>

            <div id="shipping-picker" class="shipping-options">
              <a class="shipping-option" id="shipping-cvs-link" href="#" aria-pressed="false">
                <svg class="shipping-option__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M4 9.5V20h16V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>
                <span class="shipping-option__name">超商取貨（7-11）</span>
                <span class="shipping-option__fee">$65</span>
              </a>
              <button type="button" class="shipping-option" id="shipping-home-btn" aria-pressed="false">
                <svg class="shipping-option__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="11" height="9"/><path d="M13 10.5h4l3 3V16h-7z"/><circle cx="6.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/></svg>
                <span class="shipping-option__name">宅配到府（黑貓宅急便）</span>
                <span class="shipping-option__fee">$130</span>
              </button>
            </div>

            <!-- 選定門市卡片：原本只有一行純文字，門市名稱跟地址混在一起不容易
                 一眼看出「已經選好了」；改成定位圖示＋門市名稱（粗體）＋地址
                 （次要色）分兩行的卡片，跟頁面其他資訊區塊同一套視覺語言。 -->
            <div class="confirm-store" hidden>
              <svg class="confirm-store__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>
              <div class="confirm-store__body">
                <p class="confirm-store__name"></p>
                <p class="confirm-store__address"></p>
              </div>
            </div>

            <!-- 超商取貨限定：選好門市之後，緊接著問「自行取貨」還是
                 「委託他人代為取貨」——選自行取貨就不用再填收件資料，直接
                 跳到前往付款；選委託他人才會出現下面的「③收件資料」。
                 兩顆選項底層都是同一個 #receiver-same-as-customer 的勾選
                 狀態，只是換一種說法／UI，見 checkout.js
                 syncPickupModeControls()／updateReceiverSectionVisibility()。 -->
            <div class="confirm-radio-group" id="pickup-mode-picker" hidden>
              <label class="confirm-radio">
                <input type="radio" name="pickupMode" id="pickup-mode-self" checked>
                <span>我會自行取貨</span>
              </label>
              <label class="confirm-radio">
                <input type="radio" name="pickupMode" id="pickup-mode-other">
                <span>我會委託他人代為取貨</span>
              </label>
            </div>
          </section>

          <!-- 收件資料：超商取貨且選「我會自行取貨」時，這整區完全跳過
               （customerName／Phone／Email 本來就會鏡射進 receiverName 等
               欄位一起送出，見 syncReceiverSameAsCustomer()，不用再問一次）。
               宅配到府維持原本的「與聯絡資訊一樣」勾選——姓名／電話／Email
               三格改唯讀並即時同步聯絡資訊資料，讓後端仍然收得到值（唯讀
               欄位會送出，disabled 欄位不會，所以這裡用 readOnly 不是
               disabled）；取消勾選才能自己填一組不同的收件人資料。地址只在
               宅配到府才需要。 -->
          <section class="chapter" id="receiver-section" hidden>
            <h2 class="chapter__title"><span class="step-badge">3</span>收件資料</h2>

            <div id="receiver-fields">
              <label class="confirm-field">
                <span>收件人姓名</span>
                <div class="confirm-field__control">
                  <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
                  <input type="text" name="receiverName" maxlength="20" autocomplete="name" placeholder="收件人姓名">
                </div>
              </label>
              <label class="confirm-field">
                <span>收件人電話</span>
                <div class="confirm-field__control">
                  <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5c-1 0-2 .9-2 2 0 7.2 6.3 13.5 13.5 13.5 1.1 0 2-.9 2-2v-2.3l-3.7-1-1.6 1.6a9.5 9.5 0 0 1-5.6-5.6l1.6-1.6-1-3.7H6.5z"/></svg>
                  <input type="tel" name="receiverPhone" pattern="09[0-9]{8}" placeholder="09XXXXXXXX" autocomplete="tel">
                </div>
              </label>
              <label class="confirm-field">
                <span>收件人 Email</span>
                <div class="confirm-field__control">
                  <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
                  <input type="email" name="receiverEmail" autocomplete="email" placeholder="you@example.com">
                </div>
              </label>
            </div>

            <label class="confirm-checkbox" id="receiver-same-row">
              <input type="checkbox" id="receiver-same-as-customer" checked>
              <span>與聯絡資訊一樣</span>
            </label>

            <!-- 縣市／鄉鎮市區改下拉選單（資料見 js/tw-postal-codes.js），
                 選了鄉鎮市區直接查表帶出郵遞區號——比讓客人自己輸入地址、
                 用文字比對猜測要準：光是「中山區」「東區」「西區」這種
                 名稱，台灣就有好幾個縣市共用，靠打字很難不出錯，選單先
                 選縣市再選鄉鎮市區就不會有這個問題。詳細地址（路名、
                 門牌號）維持自由輸入。送出時用 #confirm-receiver-address
                 這個隱藏欄位把「縣市＋鄉鎮市區＋詳細地址」合併成後端原本
                 認得的單一 receiverAddress（同一套模式見
                 syncCustomerName()），不改後端契約。 -->
            <div id="home-address-fields" hidden>
              <div class="confirm-field-row">
                <label class="confirm-field">
                  <span>縣市</span>
                  <div class="confirm-field__control">
                    <select id="receiver-county">
                      <option value="">請選擇</option>
                    </select>
                    <svg class="confirm-field__chevron" viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
                  </div>
                </label>
                <label class="confirm-field">
                  <span>鄉鎮市區</span>
                  <div class="confirm-field__control">
                    <select id="receiver-district" disabled>
                      <option value="">請先選縣市</option>
                    </select>
                    <svg class="confirm-field__chevron" viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
                  </div>
                </label>
              </div>
              <label class="confirm-field">
                <span>郵遞區號</span>
                <div class="confirm-field__control">
                  <input type="text" name="receiverZipCode" id="receiver-zipcode" readonly placeholder="選擇縣市／鄉鎮市區後自動帶入">
                </div>
              </label>
              <label class="confirm-field">
                <span>詳細地址（路名、門牌號）</span>
                <div class="confirm-field__control">
                  <svg class="confirm-field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>
                  <input type="text" id="receiver-address-detail" maxlength="40" placeholder="例如：松仁路100號" autocomplete="address-line1">
                </div>
              </label>
              <input type="hidden" name="receiverAddress" id="confirm-receiver-address">
            </div>
          </section>

          <div class="chapter confirm-pay" hidden>
            <p class="confirm-total"></p>
            <button type="submit" class="work__cta work__cta--primary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
              <span>前往付款</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- 訂單明細面板：從畫面下方滑出，蓋在正在填的表單上面，關掉就回到原本
       填到一半的位置（面板是 position:fixed，開關過程完全不動底下的捲動
       位置）。放在 <main> 外面，才不會被 .product-page 的 overflow 裁掉。 -->
  <div class="order-sheet" hidden>
    <div class="order-sheet__backdrop" data-order-sheet-close></div>
    <div class="order-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="order-sheet-title">
      <div class="order-sheet__head">
        <h2 class="order-sheet__title" id="order-sheet-title">訂單資訊</h2>
        <button type="button" class="order-sheet__close" data-order-sheet-close aria-label="關閉訂單明細">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul class="order-sheet__items"></ul>
      <div class="order-sheet__discount">
        <input type="text" class="order-sheet__discount-input" placeholder="折扣碼" aria-label="折扣碼">
        <button type="button" class="order-sheet__discount-apply">套用</button>
      </div>
      <dl class="order-sheet__lines">
        <div class="order-sheet__line">
          <dt>合計</dt>
          <dd data-sheet-subtotal></dd>
        </div>
        <div class="order-sheet__line">
          <dt>運費</dt>
          <dd data-sheet-shipping></dd>
        </div>
      </dl>
      <div class="order-sheet__grand">
        <span>總金額</span>
        <span data-sheet-grand></span>
      </div>
    </div>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/tw-postal-codes.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/site-header-scroll.js"></script>
  <script src="js/scroll-reveal.js"></script>
</body>
</html>
