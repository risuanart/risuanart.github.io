<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購物車｜日宣繪畫室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;600;700&family=Poppins:wght@700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="ambient-grain" aria-hidden="true"></div>

  <header>
    <a class="logo" href="index.html" aria-label="回到首頁畫布">
      <img src="assets/images/logo-risuan拷貝.png" alt="日宣繪畫室">
    </a>
    <div class="cart-badge-wrap">
      <button type="button" class="cart-badge" aria-haspopup="true" aria-expanded="false" aria-label="購物車，目前 0 件">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-badge__count">0</span>
      </button>
      <div class="cart-preview" hidden>
        <ul class="cart-preview__list"></ul>
        <p class="cart-preview__empty">購物車是空的</p>
        <p class="cart-preview__total"></p>
        <div class="cart-preview__actions">
          <a class="cart-preview__view" href="cart.html">查看購物車</a>
          <button type="button" class="cart-preview__continue">繼續選購</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="pill-nav" aria-label="全站分類導覽">
    <a href="index.html" data-cat="group">團體課</a>
    <a href="products/index.html" data-cat="materials" aria-current="page">材料包</a>
    <a href="index.html" data-cat="courses">課程</a>
  </nav>

  <main class="product-page cart-page work">

    <header class="work__intro">
      <h1 class="work-heading"><span class="inner">購物車</span></h1>
    </header>

    <!-- 購物車編輯畫面。按「結帳」之後，這一整塊會被藏起來，改顯示下面
         #order-confirm-view 那塊（同一頁往下展開，不再跳轉到另一個頁面）。
         如果網址上已經帶著 orderId（例如從綠界電子地圖選店回來），一開始
         就直接隱藏這塊、跳去顯示確認區塊，見 js/checkout.js。 -->
    <div id="cart-edit-view">
      <section class="chapter">
        <div class="cart-groups"></div>
        <p class="cart-empty" hidden>購物車目前是空的，<a class="text-link" href="products/fluid-art-intro.html">看看材料包</a>。</p>
      </section>

      <footer class="work__close">
        <div class="work__close-text">
          <p class="work__shipping-note">結帳後會請你選擇送貨方式，並線上完成付款。</p>
          <p class="checkout-error" role="alert" hidden></p>
          <p class="work__price">小計 $0</p>
        </div>
        <button type="button" class="work__cta work__cta--primary" data-checkout-cta disabled>結帳</button>
      </footer>
    </div>

    <!-- 結帳確認區塊：選送貨方式、填收件資訊，最後送出到綠界付款頁。
         內容跟欄位配置沿用原本 checkout-confirm.html 的設計，只是現在跟
         購物車在同一頁，不用另外跳轉一次。 -->
    <div id="order-confirm-view" hidden>

      <section class="chapter" id="confirm-loading">
        <p class="chapter__intro">正在載入訂單內容…</p>
      </section>

      <section class="chapter" id="confirm-error" hidden>
        <p class="chapter__intro" data-placeholder="true"></p>
        <p class="chapter__intro"><button type="button" class="text-link" id="confirm-back-to-cart">回到購物車重新結帳</button></p>
      </section>

      <div id="confirm-content" class="order-confirm-box" hidden>
        <section class="chapter">
          <h2 class="chapter__title">你選購的商品</h2>
          <ul class="confirm-items"></ul>
          <p class="confirm-subtotal"></p>
        </section>

        <!-- 送貨方式：還沒選的話顯示兩個選項；超商取貨會整頁導去綠界電子地圖，
             選完店綠界會把瀏覽器導回這一頁（帶著 orderId）；宅配到府不用離開
             這頁，直接在下面顯示地址欄位。兩條路最後都在同一個 <form> 送出
             到 create-order。 -->
        <section class="chapter" id="shipping-section">
          <h2 class="chapter__title">送貨方式</h2>

          <div id="shipping-picker" class="shipping-options">
            <a class="shipping-option" id="shipping-cvs-link" href="#">
              <span class="shipping-option__name">超商取貨（7-11）</span>
              <span class="shipping-option__fee">$65</span>
            </a>
            <button type="button" class="shipping-option" id="shipping-home-btn">
              <span class="shipping-option__name">宅配到府（黑貓宅急便）</span>
              <span class="shipping-option__fee">$130</span>
            </button>
          </div>

          <div id="shipping-cvs-confirmed" class="shipping-confirmed" hidden>
            <p class="confirm-store"></p>
            <button type="button" class="text-link" id="switch-to-home">改成宅配到府</button>
          </div>

          <div id="shipping-home-confirmed" class="shipping-confirmed" hidden>
            <p class="chapter__tags">宅配到府・運費 $130</p>
            <button type="button" class="text-link" id="switch-to-picker">改成超商取貨／重新選擇</button>
          </div>
        </section>

        <section class="chapter" id="customer-section" hidden>
          <h2 class="chapter__title">收件資訊</h2>
          <p class="confirm-total"></p>
          <form id="confirm-form" method="POST" action="">
            <input type="hidden" name="orderId" id="confirm-order-id">
            <input type="hidden" name="shippingMethod" id="confirm-shipping-method">
            <label class="confirm-field">
              <span>姓名</span>
              <input type="text" name="customerName" required maxlength="20" autocomplete="name">
            </label>
            <label class="confirm-field">
              <span>手機（取貨／到貨簡訊會發到這個號碼）</span>
              <input type="tel" name="customerPhone" required pattern="09[0-9]{8}" placeholder="09XXXXXXXX" autocomplete="tel">
            </label>
            <label class="confirm-field">
              <span>Email（付款成功／出貨通知會寄到這裡）</span>
              <input type="email" name="customerEmail" required autocomplete="email">
            </label>
            <div id="home-address-fields" hidden>
              <label class="confirm-field">
                <span>郵遞區號</span>
                <input type="text" name="receiverZipCode" id="receiver-zipcode" maxlength="5" placeholder="例如 106" autocomplete="postal-code">
              </label>
              <label class="confirm-field">
                <span>完整收件地址</span>
                <input type="text" name="receiverAddress" id="receiver-address" maxlength="60" placeholder="請填完整地址，例如：台北市信義區松仁路100號" autocomplete="street-address">
              </label>
            </div>
            <button type="submit" class="work__cta work__cta--primary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
              <span>前往付款</span>
            </button>
          </form>
        </section>
      </div>
    </div>

  </main>

  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
