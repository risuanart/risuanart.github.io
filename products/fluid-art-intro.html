<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>春聯流動畫材料包｜日宣繪畫室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;600;700&family=Poppins:wght@700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/products.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="ambient-grain" aria-hidden="true"></div>

  <header class="site-header">
    <a class="site-header__back" href="../index.html">← 返回</a>
    <div class="site-header__title">春聯流動畫材料包</div>
    <div class="cart-badge-wrap">
      <button type="button" class="cart-badge" aria-haspopup="true" aria-expanded="false" aria-label="購物車，目前 0 件">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-badge__count">0</span>
      </button>
      <div class="cart-preview" hidden>
        <ul class="cart-preview__list"></ul>
        <p class="cart-preview__empty">購物車是空的</p>
        <p class="cart-preview__total"></p>
        <div class="cart-preview__actions">
          <a class="cart-preview__view" href="../cart.html">查看購物車</a>
          <button type="button" class="cart-preview__continue">繼續選購</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="pill-nav" aria-label="全站分類導覽">
    <a href="../index.html" data-cat="group">團體課</a>
    <a href="index.html" data-cat="materials" aria-current="page">材料包</a>
    <a href="../index.html" data-cat="courses">課程</a>
  </nav>

  <main class="product-page work">

    <!-- 頁首：只負責定調與指路，不揭露版本規格差異。九宮格動畫沿用首頁預覽面板同一套
         CSS／拼貼圖，這裡額外把其中一格（col:1,row:1）換成真的影片，取代拼貼圖切片，
         data-autoplay 讓動畫在頁面載入後自動播放一次，不用等使用者先點（見 product-gallery.js
         的 initMoodboard()）。影片是 <video> 一般 HTML 屬性，相對路徑以這份 HTML 檔案本身為準
         （跟 --moodboard-src 那個 CSS url() 的解析基準不同，不要混用同一套 ../ 假設）。 -->
    <section class="intro-hero">
      <div class="moodboard" data-autoplay role="button" tabindex="0" aria-label="播放開場動畫"
           style="--moodboard-src: url('../assets/images/products/fluid-art/RS_01_主圖片_w1080xh1920拷貝.jpg')">
        <span class="moodboard__cell" style="--col:0; --row:0; --i:0"></span>
        <span class="moodboard__cell" style="--col:1; --row:0; --i:1" data-flicker></span>
        <span class="moodboard__cell" style="--col:2; --row:0; --i:2"></span>
        <span class="moodboard__cell" style="--col:0; --row:1; --i:3"></span>
        <span class="moodboard__cell" style="--col:1; --row:1; --i:4" data-video>
          <video src="../assets/images/products/fluid-art/RS_video-gold-sticker.mp4" autoplay muted loop playsinline aria-label="金色字貼近拍，實際手貼上畫布的過程"></video>
        </span>
        <span class="moodboard__cell" style="--col:2; --row:1; --i:5" data-flicker></span>
        <span class="moodboard__cell" style="--col:0; --row:2; --i:6"></span>
        <span class="moodboard__cell" style="--col:1; --row:2; --i:7"></span>
        <span class="moodboard__cell" style="--col:2; --row:2; --i:8"></span>
        <span class="moodboard__cell" style="--col:0; --row:3; --i:9" data-flicker></span>
        <span class="moodboard__cell" style="--col:1; --row:3; --i:10"></span>
        <span class="moodboard__cell" style="--col:2; --row:3; --i:11"></span>
      </div>

      <p class="intro-hero__tagline">倒入顏料，讓流動帶出色彩的變化。<br>無法復刻的作品，這是這個新年，只此一次的手作體驗。</p>

      <nav class="intro-hero__forks" aria-label="選擇材料包版本">
        <a href="fluid-art-light.html">輕巧嘗試 ↗</a>
        <a href="fluid-art-gift.html">完整的新年儀式 ↗</a>
      </nav>
    </section>

  </main>

  <script src="../js/product-gallery.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/site-header-scroll.js"></script>
</body>
</html>
