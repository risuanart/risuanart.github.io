<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>所有材料包｜日宣繪畫室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=ABeeZee&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;600;700&family=Poppins:wght@700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/products.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="ambient-grain" aria-hidden="true"></div>

  <header class="site-header">
    <a class="site-header__back" href="../index.html" data-back-fixed aria-label="回到首頁"><img src="../assets/images/logo-risuan拷貝.png" alt="日宣繪畫室"></a>
    <div class="site-header__title">所有材料包</div>
    <div class="cart-badge-wrap">
      <button type="button" class="cart-badge" aria-haspopup="true" aria-expanded="false" aria-label="購物車，目前 0 件">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-badge__count">0</span>
      </button>
      <div class="cart-preview" hidden>
        <ul class="cart-preview__list"></ul>
        <p class="cart-preview__empty">購物車是空的</p>
        <p class="cart-preview__total"></p>
        <div class="cart-preview__actions">
          <a class="cart-preview__view" href="../cart.html">查看購物車</a>
          <button type="button" class="cart-preview__continue">繼續選購</button>
        </div>
      </div>
    </div>
  </header>

  <main class="product-page work">

    <!-- 試做版型：格狀商品清單，資料來自 js/cart.js 的 PRODUCTS（見
         js/products-overview.js），不是這裡另外寫死的。目前只有材料包 4 款
         真實商品，之後商品增加，這個格子會自動跟著長，不用改版型結構。 -->
    <section class="chapter">
      <h1 class="chapter__title fade-in">所有材料包</h1>
      <p class="chapter__intro fade-in delay-1">格狀版型先做出來，商品清單之後陸續補齊。</p>

      <div class="quick-nav fade-in delay-2">
        <div class="quick-nav__search">
          <input type="search" id="materials-search" class="quick-nav__search-input" placeholder="搜尋材料包，例如：流動畫、砂畫、禮盒版" autocomplete="off" aria-label="搜尋材料包">
          <svg class="quick-nav__search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <ul class="quick-nav__search-results" id="materials-search-results" hidden></ul>
        </div>

        <!-- 4 個分類先只做視覺區塊，還沒決定連結目標（輕巧包/加購牽涉多個
             商品頁，暫時不接連結），之後方向確定再補上 href。 -->
        <div class="quick-nav__categories">
          <div class="quick-nav__cat">
            <span class="quick-nav__cat-thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5a1 1 0 0 0-1.4 0L6 19"/></svg></span>
            <span class="quick-nav__cat-label">輕巧包</span>
          </div>
          <div class="quick-nav__cat">
            <span class="quick-nav__cat-thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5a1 1 0 0 0-1.4 0L6 19"/></svg></span>
            <span class="quick-nav__cat-label">禮盒</span>
          </div>
          <div class="quick-nav__cat">
            <span class="quick-nav__cat-thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5a1 1 0 0 0-1.4 0L6 19"/></svg></span>
            <span class="quick-nav__cat-label">創作</span>
          </div>
          <div class="quick-nav__cat">
            <span class="quick-nav__cat-thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5.5-5.5a1 1 0 0 0-1.4 0L6 19"/></svg></span>
            <span class="quick-nav__cat-label">加購</span>
          </div>
        </div>
      </div>

      <div class="shop-grid" id="shop-grid" role="list" aria-label="材料包商品"></div>
    </section>

  </main>

  <script src="../js/cart.js"></script>
  <script src="../js/products-overview.js"></script>
  <script src="../js/site-header-scroll.js"></script>
  <script src="../js/scroll-reveal.js"></script>
</body>
</html>
